[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-permit-scraper"
version = "0.1.0"
description = "Scrapes building-permit records out of permit portals with no public API, normalizes them into one schema, and verifies output against the portal's own stated totals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
pipeline = [
    "duckdb>=1.0",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]

[tool.setuptools.packages.find]
include = ["src*"]
